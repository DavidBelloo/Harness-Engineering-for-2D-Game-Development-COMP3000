[project]
name = "game-harness"
version = "0.2.0"
description = "Prompt in, playable 2D game out - using only local open-source AI (no engine, no frontier model)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "pillow>=10",
    "playwright>=1.44",
    "rembg>=2.0.57",
    "onnxruntime>=1.17",
    # GPU stack. torch 2.7+ built for CUDA 12.8 is the first that runs on RTX 50-series (Blackwell, sm_120);
    # it also runs on older cards (RTX 20/30/40), so one build covers the dev PC and the lab machine.
    "torch==2.7.1",
    "diffusers==0.35.2",
    "transformers==4.56.2",
    "accelerate==1.10.1",
    "peft==0.17.1",           # LoRA loading in diffusers (pixel-art LoRA)
    "safetensors>=0.4.3",
    "huggingface-hub>=0.34,<1.0",
    "mcp>=1.2,<2",            # mcp_server.py uses the FastMCP API of the 1.x series
]

[tool.uv]
package = false

# Windows/Linux: take torch from PyTorch's CUDA 12.8 index (a plain PyPI torch on Windows is CPU-only).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
